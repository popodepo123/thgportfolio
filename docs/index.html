  <style>
    /* Gruber-Darker TUI Splash Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #101010;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
      font-family: 'Iosevka', monospace;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen.hidden {
      display: none;
    }

    .loading-content {
      text-align: left;
      color: #e4e4ef;
      max-width: 300px;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: #ffdd33;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .boot-text {
      color: #ffdd33;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status-text {
      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <!-- TUI Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="boot-text">➜ Initializing system...</div>
      <div class="status-text">Loading components...<span class="cursor"></span></div>
    </div>
  </div>

  <script>
    // Function to hide loading screen with fade effect
    function hideLoadingScreen() {
      const loadingScreen = document.getElementById('loading-screen');
      if (!loadingScreen) return;

      // Start fade out animation
      loadingScreen.classList.add('fade-out');

      // Remove loading screen after animation completes
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
      }, 800);
    }

    // Wait for Flutter to be ready
    window.addEventListener('flutter-first-frame', () => {
      hideLoadingScreen();
    });

    // Fallback: hide loading screen after a reasonable timeout
    setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen && !loadingScreen.classList.contains('fade-out')) {
        hideLoadingScreen();
      }
    }, 8000); // 8 second fallback
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
