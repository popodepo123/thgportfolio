  <style>
    /* Gruber-Darker TUI Splash Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

    .loading-content {

    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: #ffdd33;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .boot-text {
      color: #ffdd33;
      font-weight: bold;
      margin-bottom: 8px;
    }

      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>

<body>
  <!-- TUI Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="boot-text">➜ Initializing system...</div>
      <div class="status-text" id="status-text">Loading components...<span class="cursor"></span></div>
      <div class="metrics-text" id="metrics-text" style="color: #95A99F; font-size: 0.8rem; margin-top: 8px; min-height: 1.2rem;"></div>
    </div>
  </div>

  <script>
    // Intercept fetch to track download progress of large WASM/JS files
    const originalFetch = window.fetch;
    const statusText = document.getElementById('status-text');
    const metricsText = document.getElementById('metrics-text');

    let activeDownloads = 0;
    let globalSpeed = 0;
    
    // Boot tracking
    const bootStartTime = performance.now();
    let engineBootInterval = null;
    let isDownloading = false;

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function startEngineBootTimer() {
      if (engineBootInterval) return;
      const engineStartTime = performance.now();
      
      engineBootInterval = setInterval(() => {
        const elapsed = (performance.now() - engineStartTime) / 1000;
        metricsText.innerHTML = `Booting: ${elapsed.toFixed(1)}s elapsed`;
      }, 100);
    }

    window.fetch = async function (...args) {
      const url = args[0] instanceof Request ? args[0].url : args[0];
      const response = await originalFetch.apply(this, args);
      
      if (!response.body) return response;

      // Only track major flutter web assets
      if (url.includes('.wasm') || url.includes('.js') || url.includes('.bin')) {
        const contentLength = response.headers.get('content-length');
        if (contentLength) {
          activeDownloads++;
          isDownloading = true;
          const total = parseInt(contentLength, 10);
          let loaded = 0;
          const startTime = performance.now();

          const reader = response.body.getReader();
          const stream = new ReadableStream({
            async start(controller) {
              while (true) {
                const { done, value } = await reader.read();
                if (done) {
                  activeDownloads--;
                  if (activeDownloads === 0) {
                    isDownloading = false;
                    statusText.innerHTML = `Initializing framework...<span class="cursor"></span>`;
                    startEngineBootTimer();
                  }
                  break;
                }
                loaded += value.byteLength;
                
                const now = performance.now();
                const duration = (now - startTime) / 1000;
                
                if (duration > 0.1) { // Update after 100ms
                  const speed = loaded / duration; // bytes per second
                  const remainingBytes = total - loaded;
                  const etaSeconds = remainingBytes / speed;
                  
                  const speedStr = formatBytes(speed) + '/s';
                  const loadedStr = formatBytes(loaded);
                  const totalStr = formatBytes(total);
                  const pct = Math.round((loaded / total) * 100);
                  
                  const filename = url.split('/').pop().split('?')[0];
                  
                  statusText.innerHTML = `Downloading ${filename} [${pct}%]<span class="cursor"></span>`;
                  metricsText.innerHTML = `Speed: ${speedStr} | ETA: ${etaSeconds.toFixed(1)}s | Size: ${loadedStr} / ${totalStr}`;
                }

                controller.enqueue(value);
              }
              controller.close();
              reader.releaseLock();
            }
          });

          return new Response(stream, {
            headers: response.headers,
            status: response.status,
            statusText: response.statusText,
          });
        }
      }
      return response;
    };

    // Function to hide loading screen with fade effect
    function hideLoadingScreen() {
      const loadingScreen = document.getElementById('loading-screen');
      if (!loadingScreen) return;

      // Start fade out animation
      loadingScreen.classList.add('fade-out');

      // Remove loading screen after animation completes
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
      }, 800);
    }

    // Wait for Flutter to be ready
    window.addEventListener('flutter-first-frame', () => {
      if (engineBootInterval) {
        clearInterval(engineBootInterval);
      }
      
      const totalBootTime = (performance.now() - bootStartTime) / 1000;
      metricsText.innerHTML = `[OK] TTI: ${totalBootTime.toFixed(2)}s`;
      statusText.innerHTML = `Rendering view...<span class="cursor"></span>`;
      
      setTimeout(hideLoadingScreen, 400); // Give a tiny delay so user can read the final time
    });

    // Fallback: hide loading screen after a reasonable timeout
    setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen && !loadingScreen.classList.contains('fade-out')) {
        hideLoadingScreen();
      }
    }, 15000); // 15 second fallback to allow for longer downloads
  </script>
